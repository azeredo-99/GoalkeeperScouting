name: keep-alive

# O plano gratuito do Render adormece o serviço sem tráfego, e o primeiro
# visitante esperaria ~1 min pelo arranque. Um ping a cada 10 min mantém a
# demo acordada (750 h/mês gratuitas chegam para um serviço 24/7).
# Configurar: Settings -> Secrets and variables -> Actions -> Variables ->
# DEMO_URL = https://<serviço>.onrender.com

on:
  # O GitHub avisa que execuções "schedule" podem atrasar-se em picos de
  # carga, sobretudo nos minutos redondos (:00, :10, :20...) -- que é onde
  # toda a gente agenda. Confirmámos isto na prática: as duas falhas reais
  # deste workflow foram ambas precedidas por um intervalo de ~33-37 min
  # sem ping (em vez dos ~10 min esperados), o triplo do normal. Um
  # deslocamento (:03, :13, :23...) evita o minuto mais congestionado.
  schedule:
    - cron: "3-59/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    if: ${{ vars.DEMO_URL != '' }}
    steps:
      # O Render (free tier) devolve um 502 de imediato enquanto o container
      # ainda está a arrancar a frio -- não deixa a ligação pendente à espera.
      # O backoff exponencial por omissão do curl (--retry N, sem --retry-delay)
      # esgota-se em poucos segundos, muito antes de o arranque a frio (~20-40s,
      # confirmado manualmente) terminar. --retry-delay fixa um intervalo
      # constante entre tentativas e --retry-all-errors garante que também
      # tentamos de novo em erros de rede transitórios, não só nos códigos
      # HTTP retryable por omissão.
      #
      # 300s (5 min) de orçamento de retries: confirmámos nos logs do Render
      # que, quando o GitHub atrasa o agendamento e o serviço adormece a
      # fundo, o container pode demorar vários minutos só a COMEÇAR a
      # arrancar (não é só o arranque em si, que demora ~10s) -- 180s não
      # chegou em dois incidentes reais; 300s dá margem sem arriscar colidir
      # com o próximo ping agendado 10 min depois.
      - run: curl -fsS --max-time 90 --retry 20 --retry-delay 10 --retry-max-time 300 --retry-all-errors "${{ vars.DEMO_URL }}/api/health"
