# Render Blueprint -- demo pública num único serviço gratuito.
#
# "New +" -> "Blueprint" no dashboard do Render, apontado a este
# repositório. A imagem (Dockerfile) compila o frontend React e serve-o a
# partir da própria API FastAPI, com os dados de data/demo/ convertidos
# para SQLite no build: sem base de dados gerida, sem segredos, sem CORS.
#
# O plano gratuito adormece após ~15 min sem pedidos; o workflow
# .github/workflows/keepalive.yml faz um ping periódico (define a variável
# de repositório DEMO_URL com o URL público do serviço).
services:
  - type: web
    name: goalkeeper-scouting
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
