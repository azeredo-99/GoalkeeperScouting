# Render Blueprint -- deploy via "New +" -> "Blueprint" no dashboard do
# Render, apontado a este repositório. Define o backend (FastAPI) como
# um web service gratuito; a base de dados fica fora daqui de propósito
# (usamos Neon, não o Postgres do Render -- ver README/DEPLOY.md).
#
# DATABASE_URL não vem definida aqui (sync: false) -- é um segredo,
# preenche-se manualmente no dashboard do Render depois do deploy, nunca
# commitado no repositório.
services:
  - type: web
    name: goalkeeper-scouting-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn gk_scouting.api.main:app --app-dir src --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: PYTHON_VERSION
        value: 3.14.3
