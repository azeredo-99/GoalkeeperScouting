[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

# Sem sqlalchemy.url aqui de propósito: a ligação vem de DATABASE_URL,
# lida em alembic/env.py através de gk_scouting.db.config.get_database_url().
# Um valor aqui seria um segredo (ou um placeholder enganador) versionado
# no repositório.

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
