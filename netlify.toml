# Config do Netlify para o frontend, que vive em frontend/ dentro do
# monorepo -- "base" diz ao Netlify para tratar essa pasta como raiz do
# projeto ao instalar dependências e correr o build.
#
# VITE_API_URL não fica aqui (não é segredo, mas depende do URL do
# backend no Render, só conhecido depois desse deploy) -- define-se no
# dashboard do Netlify em Site settings > Environment variables.
[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
